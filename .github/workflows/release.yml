name: Windows Portable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate release version
        id: version
        run: |
          [xml]$project = Get-Content -LiteralPath DomainDesk/DomainDesk.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Unsupported project version: $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must match project version v$version."
          }
          "package=DomainDesk-win-x64-v$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and publish portable app
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
        run: ./build.ps1 -Test -Publish -ReleaseName $env:PACKAGE

      - name: Smoke test portable executable
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
        run: ./scripts/Test-Portable.ps1 -Executable "artifacts/$env:PACKAGE/DomainDesk.exe"

      - name: Generate SHA256 checksum
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          $zip = "artifacts/$env:PACKAGE.zip"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PACKAGE.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Upload portable build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.version.outputs.package }}
          path: |
            artifacts/${{ steps.version.outputs.package }}.zip
            artifacts/${{ steps.version.outputs.package }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $release = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($release | ConvertFrom-Json).isDraft) {
              Write-Host "Release $tag is already published; leaving its assets unchanged."
              exit 0
            }
          } else {
            gh release create $tag --verify-tag --draft --title "Domain Desk $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          gh release upload $tag "artifacts/$env:PACKAGE.zip" "artifacts/$env:PACKAGE.zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets; release remains a draft.' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
